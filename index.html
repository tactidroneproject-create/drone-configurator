
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drone Configurator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            color: #1a1a1a;
        }

        header {
            background-color: #111;
            color: white;
            padding: 24px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-top: 8px;
            color: #cccccc;
        }

        section {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 32px;
            border-radius: 6px;
        }

        h2 {
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        ul {
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #555;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>
    <h1>Drone Configurator</h1>
    <p>Design and validate reliable drone configurations</p>
</header>

<section>
    <h2>Status</h2>
    <p>
        🚧 This prototype will evolve into a mission-driven drone definition system.
    </p>
</section>

<section>
    <h2>Simple Configuration (temporary)</h2>

    <label>Frame</label><br>
    <select id="frame">
        <option value="">Select frame</option>
        <option value="GEPRC LC75 – 7.5 inch">GEPRC LC75 – 7.5 inch</option>
    </select><br><br>

    <label>Motors</label><br>
    <select id="motor">
        <option value="">Select motors</option>
        <option value="EMAX ECO II 2207 – 1700KV">EMAX ECO II 2207 – 1700KV</option>
    </select><br><br>

    <label>ESC</label><br>
    <select id="esc">
        <option value="">Select ESC</option>
        <option value="T‑Motor F55A Pro II – 55A">T‑Motor F55A Pro II – 55A</option>
    </select><br><br>

    <button onclick="generateConfig()">Generate Configuration</button>

    <div id="result" style="margin-top:20px;"></div>
</section>

<footer>
    © Prototype project – Drone Configurator
</footer>

<script>
function generateConfig() {
    const frame = document.getElementById("frame").value;
    const motor = document.getElementById("motor").value;
    const esc = document.getElementById("esc").value;

    if (!frame || !motor || !esc) {
        document.getElementById("result").innerHTML =
            "<p style='color:red;'>Please select all components.</p>";
        return;
    }

    document.getElementById("result").innerHTML = `
        <h3>Validated Configuration ✅</h3>
        <ul>
            <li><strong>Frame:</strong> ${frame}</li>
            <li><strong>Motors:</strong> ${motor}</li>
            <li><strong>ESC:</strong> ${esc}</li>
        </ul>

        <p>
            This configuration is based on a known compatible setup and serves
            as a reference baseline.
        </p>
    `;
}
</script>

</body>
</html>
