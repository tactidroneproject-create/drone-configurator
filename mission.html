<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geminus Aerial Systems – Configurador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Estilos idénticos a index.html para cohesión */
        :root { --primary: #007bff; --dark: #111; --light: #f4f6f8; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--light); color: #333; }
        .top-nav { position: sticky; top: 0; z-index: 1100; background: var(--dark); padding: 15px 25px; display: flex; gap: 25px; }
        .top-nav a { color: var(--white); text-decoration: none; font-size: 14px; font-weight: bold; text-transform: uppercase; }
        header { background: var(--dark); color: var(--white); padding: 60px 20px; text-align: center; }
        .container { max-width: 800px; margin: -40px auto 40px; background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; background: var(--dark); color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        button:hover { background: var(--primary); }
        #droneResult { margin-top: 30px; padding: 25px; border-radius: 10px; display: none; }
        .success { border-left: 8px solid #4caf50; background: #f1f8e9; }
        .warning { border-left: 8px solid #ff9800; background: #fff3e0; }
        .error { border-left: 8px solid #f44336; background: #ffebee; }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html">Sobre Nosotros</a>
    <a href="mission.html">Definir Misión</a>
</nav>

<header>
    <h1>Configurador de Misiones UAS</h1>
    <p>Define tu objetivo y generaremos la lista de componentes necesaria</p>
</header>

<div class="container">
    <div class="form-group">
        <label>Tipo de Misión / Carga Útil</label>
        <select id="payload">
            <option value="0">Exploración Ligera (0g)</option>
            <option value="500">Vigilancia con Sensor (500g)</option>
            <option value="1200">Misión Táctica Pesada (1200g)</option>
        </select>
    </div>
    <div class="form-group">
        <label>Alcance Deseado</label>
        <select id="endurance">
            <option value="30">Estándar (20-30 min)</option>
            <option value="50">Largo Alcance (40-50 min)</option>
        </select>
    </div>
    <button onclick="calculateMission()">Generar Definición Técnica</button>

    <div id="droneResult"></div>
</div>

<script>
// Base de datos integrada de EMAX, Ovonic y Prototipo Geminus
const db = {
    fc: { name: "Matek H743-SLIM V3", weight: 7 }, // [12, 13]
    esc: { name: "T-Motor F55A Pro II", weight: 17.5 }, // [14]
    vtx: { name: "Walksnail Avatar HD", weight: 18.4 }, // [15]
    gps: { name: "BN-880 GPS/Compass", weight: 10 }, // [16]
    motors: {
        std: { name: "EMAX ECO II 2207 (1700KV)", weight: 33.4, thrust: 1780 }, // [2, 17]
        heavy: { name: "EMAX ECO II 2812 (930KV)", weight: 72, thrust: 2850 } // [17]
    },
    batteries: {
        "30": { name: "Ovonic 6S 5500mAh", weight: 753, ah: 5.5 }, // [8]
        "50": { name: "Ovonic 6S 6500mAh", weight: 777, ah: 6.5 }  // [8]
    }
};

function calculateMission() {
    const payload = parseInt(document.getElementById("payload").value);
    const endurance = document.getElementById("endurance").value;
    const motor = payload > 800 ? db.motors.heavy : db.motors.std;
    const battery = db.batteries[endurance];
    
    // Peso total (AUW)
    const auw = 266 + (motor.weight * 4) + battery.weight + db.fc.weight + db.esc.weight + db.vtx.weight + db.gps.weight + payload + 25; 
    
    // Normativa España (RD 517/2024) [18-20]
    let legalCat = auw < 250 ? "A1" : "A3";
    let registration = "OBLIGATORIA (Cámara detectada)"; // [21, 22]
    let heightLimit = "120m AGL"; // [23, 24]

    const resultDiv = document.getElementById("droneResult");
    resultDiv.style.display = "block";
    resultDiv.className = "success";
    
    resultDiv.innerHTML = `
        <h3>Definición de Sistema Geminus</h3>
        <p><strong>Masa Máxima (MTOM):</strong> ${Math.round(auw)}g</p>
        <p><strong>Componentes Sugeridos:</strong> 4x ${motor.name}, Batería ${battery.name}, Stack ${db.fc.name}.</p>
        <hr>
        <h4><i class="fas fa-gavel"></i> Requerimientos Legales (AESA)</h4>
        <ul>
            <li><strong>Categoría de Vuelo:</strong> Abierta - Subcategoría ${legalCat} [19].</li>
            <li><strong>Registro de Operador:</strong> ${registration} [22].</li>
            <li><strong>Límite de Altura:</strong> ${heightLimit} [24].</li>
            <li><strong>Seguro RC:</strong> Exento si es recreativo < 20kg [25].</li>
        </ul>
    `;
}
</script>

</body>
</html>
