<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geminus Aerial Systems – Configurador Técnico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #007bff; --dark: #111; --light: #f4f6f8; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--light); color: #333; }
        .top-nav { position: sticky; top: 0; z-index: 1100; background: var(--dark); padding: 15px 25px; display: flex; gap: 25px; }
        .top-nav a { color: var(--white); text-decoration: none; font-size: 14px; font-weight: bold; text-transform: uppercase; }
        header { background: var(--dark); color: var(--white); padding: 60px 20px; text-align: center; }
        .container { max-width: 900px; margin: -40px auto 40px; background: var(--white); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .form-group { margin-bottom: 25px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: var(--dark); }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: #fafafa; }
        .desc { font-size: 13px; color: #666; margin-top: 5px; }
        
        button { width: 100%; background: var(--dark); color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        button:hover { background: var(--primary); transform: translateY(-2px); }

        #droneResult { margin-top: 30px; padding: 25px; border-radius: 10px; display: none; line-height: 1.6; }
        .success { border-left: 8px solid #4caf50; background: #f1f8e9; }
        .warning { border-left: 8px solid #ff9800; background: #fff3e0; }
        .error { border-left: 8px solid #f44336; background: #ffebee; }

        .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
        .spec-item { font-size: 14px; background: rgba(255,255,255,0.5); padding: 8px; border-radius: 4px; }
        .legal-tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html">Sobre Nosotros</a>
    <a href="mission.html">Definir Misión</a>
</nav>

<header>
    <h1>Configurador de Misiones</h1>
    <p>Ingeniería Geminus: Validación de MTOM, Empuje y Normativa</p>
</header>

<div class="container">
    <!-- Dropdown 1: Payload (Restaurado) -->
    <div class="form-group">
        <label><i class="fas fa-weight-hanging"></i> Carga Útil (Payload)</label>
        <select id="payload">
            <option value="">Seleccionar...</option>
            <option value="300">0–300 g (Cámara ligera)</option>
            <option value="800">300–800 g (Sensores / Servo MG996)</option>
            <option value="1500">800–1500 g (Carga táctica)</option>
        </select>
        <p class="desc">Masa adicional que transportará el dron [1, 2].</p>
    </div>

    <!-- Dropdown 2: Endurance (Restaurado) -->
    <div class="form-group">
        <label><i class="fas fa-battery-half"></i> Autonomía Deseada</label>
        <select id="endurance">
            <option value="">Seleccionar...</option>
            <option value="30">20–30 min</option>
            <option value="45">30–45 min</option>
            <option value="60">45–60 min</option>
        </select>
        <p class="desc">Tiempo objetivo basado en la serie Ovonic Roam [2].</p>
    </div>

    <!-- Dropdown 3: Footprint/Size (Restaurado) -->
    <div class="form-group">
        <label><i class="fas fa-ruler-combined"></i> Tamaño del Chasis (Footprint)</label>
        <select id="size">
            <option value="">Seleccionar...</option>
            <option value="35">≤ 35 cm (Clase 7")</option>
            <option value="45">≤ 45 cm (Clase 10")</option>
            <option value="60">≤ 60 cm (Heavy Lift)</option>
        </select>
        <p class="desc">Limitación de tamaño de motor a motor [3].</p>
    </div>

    <button onclick="generateDrone()">GENERAR DEFINICIÓN TÉCNICA</button>

    <div id="droneResult"></div>
</div>

<script>
// Base de datos técnica completa (EMAX, Ovonic, Matek)
const db = {
    avionicsWeight: 7 + 17.5 + 18.4 + 10 + 22.8 + 14.3, // FC+ESC+VTX+GPS+Props+Misc [4-6]
    motors: {
        std: { name: "EMAX ECO II 2207 (1700KV)", weight: 33.4, thrust: 1780 }, // [7]
        heavy: { name: "EMAX ECO II 2812 (930KV)", weight: 72.0, thrust: 2850 }, // [8]
        industrial: { name: "EMAX ECO II 3515 (450KV)", weight: 139, thrust: 6270 }
    },
    batteries: {
        "30": { label: "OVONIC 6S 5500mAh", weight: 753, capacityAh: 5.5 }, // [9, 10]
        "45": { label: "OVONIC 6S 6500mAh", weight: 777, capacityAh: 6.5 }, // [11]
        "60": { label: "OVONIC 6S 8000mAh", weight: 826, capacityAh: 8.0 }  // [11]
    }
};

function generateDrone() {
    const payload = parseInt(document.getElementById("payload").value);
    const endurance = document.getElementById("endurance").value;
    const size = parseInt(document.getElementById("size").value);

    if (!payload || !endurance || !size) {
        alert("Por favor, selecciona todos los parámetros.");
        return;
    }

    const battery = db.batteries[endurance];
    const frameWeight = size <= 35 ? 266 : size <= 45 ? 261 : 360; // GEPRC LC75 es 266g [11, 12]
    
    // Selección inteligente de motor según tamaño y peso
    let motor = db.motors.std;
    if (size > 35 || payload > 800) motor = db.motors.heavy;
    if (size >= 60) motor = db.motors.industrial;

    const auw = payload + battery.weight + frameWeight + (motor.weight * 4) + db.avionicsWeight;
    const requiredThrustPerMotor = (auw * 2) / 4; // Relación 2:1 recomendada [11]
    
    // Validación de estado técnico
    let status = "✅ APTO";
    let statusClass = "success";
    if (requiredThrustPerMotor > motor.thrust) {
        status = "❌ FALLO: Peso excesivo";
        statusClass = "error";
    } else if (requiredThrustPerMotor > motor.thrust * 0.7) {
        status = "⚠️ MARGINAL: Rendimiento limitado";
        statusClass = "warning";
    }

    // Lógica Normativa AESA (España)
    const legalCat = auw < 250 ? "A1" : "A3"; // [13]
    const legalDist = auw < 250 ? "Puede volar sobre personas (no concentraciones)" : "Mínimo 150m de zonas urbanas [14]";

    const resultDiv = document.getElementById("droneResult");
    resultDiv.style.display = "block";
    resultDiv.className = statusClass;

    resultDiv.innerHTML = `
        <h3><i class="fas fa-file-invoice"></i> Especificación Técnica Geminus</h3>
        <p><strong>Resultado:</strong> ${status}</p>
        <div class="spec-grid">
            <div class="spec-item"><strong>Chasis:</strong> Clase ${size} cm (${frameWeight}g)</div>
            <div class="spec-item"><strong>Motores:</strong> 4x ${motor.name}</div>
            <div class="spec-item"><strong>Batería:</strong> ${battery.label} (${battery.weight}g)</div>
            <div class="spec-item"><strong>Electrónica:</strong> Stack Matek + Walksnail HD</div>
        </div>
        <p><strong>Masa Máxima al Despegue (MTOM):</strong> ${Math.round(auw)} g</p>
        <p><strong>Empuje Requerido por Motor (2:1):</strong> ${Math.round(requiredThrustPerMotor)} g</p>
        <hr>
        <h4><i class="fas fa-gavel"></i> Cumplimiento Normativo (España)</h4>
        <p><strong>Subcategoría:</strong> <span class="legal-tag" style="background:#000; color:#fff;">${legalCat} (Construcción Privada)</span></p>
        <p><strong>Restricción:</strong> ${legalDist}</p>
        <p style="font-size:12px; color:#666;">*Registro de operador obligatorio por sensor de captura de datos (Walksnail) [13].</p>
    `;
}
</script>
</body>
</html>
